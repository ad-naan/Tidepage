name: desktop-native
on:
  push:
    paths:
      [
        "desktop/**",
        "services/realtime/**",
        "src/shared/realtime/**",
        "src/server/realtime/**",
        "tests/platform/realtime*.ts",
        ".github/workflows/desktop.yml",
      ]
  pull_request:
    paths:
      [
        "desktop/**",
        "services/realtime/**",
        "src/shared/realtime/**",
        "src/server/realtime/**",
        "tests/platform/realtime*.ts",
        ".github/workflows/desktop.yml",
      ]
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Linux native graphics and tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libayatana-appindicator3-dev xvfb xauth xdotool openbox wmctrl weston desktop-file-utils
      - name: Windows native compiler
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress -y
      - run: go test -tags ci ./...
      - name: Race checks for shared state
        if: runner.os == 'Linux'
        run: go test -race ./internal/config ./internal/collector ./internal/localipc ./internal/protocol
      - name: Windows executable
        if: runner.os == 'Windows'
        run: ./build-windows.ps1
      - name: Build Unix application package
        if: runner.os != 'Windows'
        run: sh build-unix.sh
      - name: Launch packaged macOS preview
        if: runner.os == 'macOS'
        run: |
          ditto -x -k dist/TidepageCompanion-macOS.zip "$RUNNER_TEMP/companion"
          app="$RUNNER_TEMP/companion/Tidepage Companion.app"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/tidepage-companion" --preview &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          swift packaging/check-macos-preview.swift "$pid"
      - name: Launch packaged Linux preview on X11 and Wayland
        if: runner.os == 'Linux'
        run: |
          mkdir "$RUNNER_TEMP/companion"
          tar -xzf dist/TidepageCompanion-Linux.tar.gz -C "$RUNNER_TEMP/companion"
          desktop-file-validate "$RUNNER_TEMP/companion/share/applications/blog.tidepage.companion.desktop"
          exe="$RUNNER_TEMP/companion/bin/tidepage-companion"
          xvfb-run -a sh packaging/check-linux-preview.sh "$exe" x11
          xvfb-run -a sh packaging/check-linux-preview.sh "$exe" wayland
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ runner.os }}-${{ runner.arch }}
          path: desktop/dist/*
  realtime-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .cache && cd desktop && go build -o ../.cache/go-probe ./internal/realtime/testdata/probe.go
      - run: pnpm test:realtime
        env:
          REALTIME_TEST_REDIS_URL: redis://localhost:6379
          REALTIME_TEST_REDIS_STREAMS_URL: redis://localhost:6379
          REALTIME_GO_PROBE: ${{ github.workspace }}/.cache/go-probe
