# 安装到现有 base-nginx 的 conf.d，替换旧博客配置，不能与旧域名 server 并存。
# 前提：CDN 对外提供 HTTPS、强制 HTTPS，并以原始 Host 回源本机 HTTP 80。
# 主域名为 www.adnaan.site；不对其强制 HTTPS 跳转，以免 CDN 回源重定向循环。
map $http_upgrade $tidepage_connection_upgrade {
    default upgrade;
    ''      close;
}

# 未配置可信 CDN real_ip 时，remote_addr 是 CDN 节点 IP，限流会按节点聚合。
limit_req_zone $binary_remote_addr zone=tidepage_ws:10m rate=30r/s;

server {
    listen 80;
    server_name adnaan.site;
    return 308 https://www.adnaan.site$request_uri;
}

server {
    listen 80;
    server_name www.adnaan.site;
    client_max_body_size 50m;

    # 容器重建后 IP 可能变化；使用 Docker DNS 定期解析网络别名。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $tidepage_web http://adnaan-web:3000;
    set $tidepage_realtime http://adnaan-realtime:3101;

    location ^~ /socket.io/ {
        limit_req zone=tidepage_ws burst=60 nodelay;
        proxy_pass $tidepage_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tidepage_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Next.js 处理页面、API、上传文件和静态资源，并决定各自的 Cache-Control。
    location / {
        proxy_pass $tidepage_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }
}
