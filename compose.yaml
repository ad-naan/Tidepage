# 只编排本项目自身的服务：web（Next.js）、realtime（Socket.IO 网关）、nginx（入口）。
# PostgreSQL 与 Redis 使用外部已有实例，地址通过 .env 提供。
name: tidepage
services:
  web:
    build:
      context: .
      target: web
      args:
        # NEXT_PUBLIC_* 在构建期内联，需与 REALTIME_ORIGINS 的对外地址一致。
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-}
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      # Web 侧缓存可选；网关 Redis 用独立的 REALTIME_REDIS_URL。
      REDIS_URL: ${REDIS_URL:-}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-tidepage:prod:v1}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      TRUST_PROXY_CLIENT_IP: "true"
      AI_CHAT_COMPLETIONS_URL: ${AI_CHAT_COMPLETIONS_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MCP_PUBLICATION_URL: ${AI_MCP_PUBLICATION_URL:-}
      AI_MCP_PUBLICATION_TOOL: ${AI_MCP_PUBLICATION_TOOL:-}
      AI_MCP_PUBLICATION_TOKEN: ${AI_MCP_PUBLICATION_TOKEN:-}
      AI_GUIDE_ENABLED: ${AI_GUIDE_ENABLED:-false}
      INDEXING_ENABLED: ${INDEXING_ENABLED:-false}
      UPLOAD_DIR: /app/storage/uploads
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GITEE_CLIENT_ID: ${OAUTH_GITEE_CLIENT_ID:-}
      OAUTH_GITEE_CLIENT_SECRET: ${OAUTH_GITEE_CLIENT_SECRET:-}
      # Same private key as the gateway: signs coastal identity and memory proofs.
      REALTIME_AUTHOR_TOKEN: ${REALTIME_AUTHOR_TOKEN:?Set REALTIME_AUTHOR_TOKEN in .env}
    volumes:
      - ./storage:/app/storage
    expose:
      - "3000"
    restart: unless-stopped

  realtime:
    build:
      context: .
      target: realtime
    environment:
      NODE_ENV: production
      # 容器内必须监听 0.0.0.0，对外只经 nginx 反代。
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: "3101"
      REALTIME_ORIGINS: ${REALTIME_ORIGINS:?Set REALTIME_ORIGINS in .env}
      REALTIME_AUTHOR_TOKEN: ${REALTIME_AUTHOR_TOKEN:?Set REALTIME_AUTHOR_TOKEN in .env}
      # 网关 Redis 实例要求 noeviction，见 docs/deployment.md。
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:?Set REALTIME_REDIS_URL in .env}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-tidepage:prod:v1}
    expose:
      - "3101"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    environment:
      TIDEPAGE_DOMAIN: ${TIDEPAGE_DOMAIN:?Set TIDEPAGE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/tidepage.conf.template:/etc/nginx/templates/tidepage.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_started
      realtime:
        condition: service_healthy
    restart: unless-stopped
